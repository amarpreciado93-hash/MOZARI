<!--
  Mozari · UBICACIÓN EN SATÉLITE (Laboratorio «ubicacion»)
  Pedido de Amar (18 nov 2026): subir el KMZ del desarrollo y verlo sobre el satélite, para ubicarlo y moverse por él.
  En esta fase no lleva los datos de cada lote (eso vive en el tour 360 y en la lista de lotes).
  Una sola página para todos: se arma con el proyecto publicado (proyecto.json de su carpeta) o, en el estudio, con lo
  que le manda el editor (postMessage). El satélite lo da el servidor en <meta name="mz-sat"> (o el editor); si no hay,
  o se acabó el mes gratis del proveedor, el plano se ve sobre fondo oscuro. Los lotes los pinta la tarjeta de video
  (MapLibre) y los números van en un lienzo encima, solo al acercar.
-->
<style>

  .cab { position: fixed; z-index: 5; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); max-width: min(62vw, 420px); padding: 10px 16px 11px; border-radius: 16px; background: rgba(11, 11, 11, 0.78); border: 1px solid var(--linea); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  .am p { margin: 0; font-size: 14px; }
  .am div { display: flex; gap: 8px; flex-wrap: wrap; }
  .am button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--linea); background: transparent; color: var(--texto); font: 500 13px "Poppins", sans-serif; cursor: pointer; }
  .am button.si { background: var(--acento); color: var(--sobre); border-color: transparent; font-weight: 600; }

<body>

</div>

<div class="atrib" id="atrib" hidden></div>

<div class="am" id="am" hidden><small id="am-paso"></small><p id="am-txt"></p><div><button type="button" class="si" data-am="listo">Listo</button><button type="button" data-am="quitar">Quitar amarre</button><button type="button" data-am="cancelar">Cancelar</button></div></div>
<script src="/lib/maplibre-gl.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const previa = /(^|[#&])previa\b/.test(location.hash) && window.parent !== window;
  const RT = 6378137, RAD = Math.PI / 180;
  const aMerc = (c) => [RT * c[0] * RAD, RT * Math.log(Math.tan(Math.PI / 4 + (c[1] * RAD) / 2))];
  const deMerc = (p) => [p[0] / RT / RAD, (2 * Math.atan(Math.exp(p[1] / RT)) - Math.PI / 2) / RAD];
  let map = null, base = "", SAT = (document.querySelector('meta[name="mz-sat"]') || {}).content || "", conSat = true, fallosSat = 0, satBien = false;
  let crudo = null, pares = [], D = null, listo = false, rotulos = { lotes: [], mz: [] }, zLote = 99, zMz = 99, zLinea = 0, alfa = { lotes: 0, mz: 0 }, tPulso = 0, pulsoRaf = 0, pintaRaf = 0, avisoT = 0;
  const estado = { rotulosLotes: 0, rotulosMz: 0, pulsos: 0, msPintar: 0 };
  const vacio = (t, d) => { let v = document.querySelector(".vacio"); if (!v) { v = document.createElement("div"); v.className = "vacio"; document.body.appendChild(v); } v.innerHTML = "<div><b></b><span></span></div>"; v.querySelector("b").textContent = t; v.querySelector("span").textContent = d || ""; };
  const aviso = (t, ms) => { const a = $("aviso"); clearTimeout(avisoT); a.textContent = t; a.hidden = !t; if (t && ms !== 0) avisoT = setTimeout(() => (a.hidden = true), ms || 5000); };
  // ---- Amarre: el plano se mueve (1 punto) o se mueve, gira y cambia de tamaño (2 puntos) para caer sobre el satélite ----
  // En metros de mapa, como números complejos: z' = α·z + β. Cada par: [lng, lat del plano, lng, lat del satélite].
  function transformacion(ps) {
    const ok = (ps || []).filter((p) => Array.isArray(p) && p.length === 4 && p.every((v) => typeof v === "number" && isFinite(v)));
    if (!ok.length) return null;
    const a1 = aMerc([ok[0][0], ok[0][1]]), b1 = aMerc([ok[0][2], ok[0][3]]);
    let ar = 1, ai = 0, soloMover = false;
    if (ok.length > 1) {
      const a2 = aMerc([ok[1][0], ok[1][1]]), b2 = aMerc([ok[1][2], ok[1][3]]), dx = a2[0] - a1[0], dy = a2[1] - a1[1], ex = b2[0] - b1[0], ey = b2[1] - b1[1], n = dx * dx + dy * dy;
      if (n > 1) { ar = (ex * dx + ey * dy) / n; ai = (ey * dx - ex * dy) / n; const esc = Math.hypot(ar, ai); if (esc < 0.5 || esc > 2) { ar = 1; ai = 0; soloMover = true; } } // un tamaño absurdo se ignora (puntos mal puestos)
      else soloMover = true;
    }
    const T = (c) => { const p = aMerc(c), x = p[0] - a1[0], y = p[1] - a1[1]; return deMerc([b1[0] + ar * x - ai * y, b1[1] + ai * x + ar * y]); };
    T.soloMover = soloMover; return T;
  }
  // ---- Los datos, ya en su lugar ----
  function preparar() {
    const T = transformacion(pares), mover = (c) => (T ? T(c) : c), anillo = (c) => c.map(mover);
    const d = { contorno: (crudo.contorno || []).map(anillo), lotes: (crudo.lotes || []).map((l) => ({ c: anillo(l.c), n: l.n || "", mz: l.mz || "" })), otras: (crudo.otras || []).map((o) => ({ t: o.t, c: anillo(o.c) })) };
    let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
    const ver = (c) => c.forEach((p) => { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; });
    d.contorno.forEach(ver); d.lotes.forEach((l) => ver(l.c)); d.otras.forEach((o) => ver(o.c));
    d.caja = [x0, y0, x1, y1]; d.centro = [(x0 + x1) / 2, (y0 + y1) / 2];
    // Medidas en metros (para decidir desde qué acercamiento cabe cada número) y el punto de cada rótulo
    const kx = RAD * RT * Math.cos(d.centro[1] * RAD), ky = RAD * RT;
    const medir = (c) => { let a = 0, sx = 0, sy = 0, largo = 0; for (let i = 0, n = c.length; i < n; i++) { const p = c[i], q = c[(i + 1) % n], x1b = (p[0] - d.centro[0]) * kx, y1b = (p[1] - d.centro[1]) * ky, x2 = (q[0] - d.centro[0]) * kx, y2 = (q[1] - d.centro[1]) * ky, f = x1b * y2 - x2 * y1b, l = Math.hypot(x2 - x1b, y2 - y1b); a += f; sx += (x1b + x2) * f; sy += (y1b + y2) * f; if (l > largo) largo = l; } a /= 2; if (Math.abs(a) < 1e-9) return { m2: 0, angosto: 0, p: c[0] }; return { m2: Math.abs(a), angosto: Math.min(Math.sqrt(Math.abs(a)), Math.abs(a) / (largo || 1)), p: [d.centro[0] + sx / (6 * a) / kx, d.centro[1] + sy / (6 * a) / ky] }; };
    const lot = [], grupos = new Map(), anchos = [];
    d.lotes.forEach((l) => {
      const m = medir(l.c); l.m2 = m.m2; if (m.angosto > 0) anchos.push(m.angosto);
      if (l.n) lot.push({ p: m.p, t: l.n, tam: m.angosto });
      if (l.mz) { let g = grupos.get(l.mz); if (!g) grupos.set(l.mz, (g = { x: 0, y: 0, n: 0, x0: 180, y0: 90, x1: -180, y1: -90 })); g.x += m.p[0]; g.y += m.p[1]; g.n++; l.c.forEach((p) => { if (p[0] < g.x0) g.x0 = p[0]; if (p[0] > g.x1) g.x1 = p[0]; if (p[1] < g.y0) g.y0 = p[1]; if (p[1] > g.y1) g.y1 = p[1]; }); }
    });
    const mz = []; grupos.forEach((g, k) => mz.push({ p: [g.x / g.n, g.y / g.n], t: k, tam: Math.min((g.x1 - g.x0) * kx, (g.y1 - g.y0) * ky) }));
    rotulos = { lotes: lot, mz };
    // Desde qué acercamiento se ven: cuando el lado angosto del lote típico mide unos 18 px en pantalla (y la manzana unos 30)
    const tipico = (l, q) => { const s = l.map((r) => r.tam).filter((v) => v > 0).sort((a, b) => a - b); return s.length ? s[Math.floor(s.length * q)] : 0; };
    const zDe = (metros, px) => (metros > 0 ? Math.log2((78271.517 * Math.cos(d.centro[1] * RAD) * px) / metros) : 99);
    zLote = zDe(tipico(lot, 0.35), 18); zMz = zDe(tipico(mz, 0.35), 30);
    if (zMz > zLote - 0.6) zMz = 99; // manzanas tan chicas como sus lotes: van directo los números de lote
    anchos.sort((a, b) => a - b); zLinea = anchos.length > 300 ? Math.max(0, Math.min(18, zDe(anchos[Math.floor(anchos.length * 0.35)], 3))) : 0; // con pocos lotes, siempre
    D = d;
  }
  const fc = (polis) => ({ type: "FeatureCollection", features: polis.map((c, i) => ({ type: "Feature", id: i, properties: {}, geometry: { type: "Polygon", coordinates: [c.concat([c[0]])] } })) });
  function pintarDatos(encuadrar) {
    preparar();
    const orilla = D.contorno.length ? D.contorno : envolvente(D);
    const fuentes = { contorno: fc(orilla), lotes: fc(D.lotes.map((l) => l.c)), calles: fc(D.otras.filter((o) => o.t === "calle").map((o) => o.c)), verdes: fc(D.otras.filter((o) => o.t === "verde").map((o) => o.c)), amen: fc(D.otras.filter((o) => o.t === "amenidad").map((o) => o.c)), mzs: fc(D.otras.filter((o) => o.t === "manzana").map((o) => o.c)) };
    Object.keys(fuentes).forEach((k) => { const s = map.getSource(k); if (s) s.setData(fuentes[k]); else map.addSource(k, { type: "geojson", data: fuentes[k], tolerance: 0.3, buffer: 32, maxzoom: 17 }); });
    if (!map.getLayer("lotes")) {
      const acento = getComputedStyle(document.documentElement).getPropertyValue("--acento").trim() || "#D5FF40";
      map.addLayer({ id: "calles", type: "fill", source: "calles", paint: { "fill-color": "#C9CCD1", "fill-opacity": 0.28 } });
      map.addLayer({ id: "verdes", type: "fill", source: "verdes", paint: { "fill-color": "#4FD08A", "fill-opacity": 0.32 } });
      map.addLayer({ id: "amen", type: "fill", source: "amen", paint: { "fill-color": "#FFB84D", "fill-opacity": 0.34 } });
      map.addLayer({ id: "lotes", type: "fill", source: "lotes", paint: { "fill-color": acento, "fill-antialias": false, "fill-opacity": ["interpolate", ["linear"], ["zoom"], 13, 0.34, 17, 0.2, 20, 0.1] } });
      map.addLayer({ id: "lotes-linea", type: "line", source: "lotes", paint: { "line-color": "#FFFFFF", "line-opacity": ["interpolate", ["linear"], ["zoom"], 13, 0.35, 16, 0.75, 20, 0.95], "line-width": ["interpolate", ["linear"], ["zoom"], 13, 0.3, 16, 0.8, 19, 1.6, 21, 2.4] } });
      map.addLayer({ id: "mzs", type: "line", source: "mzs", layout: { "line-join": "round" }, paint: { "line-color": "#FFFFFF", "line-opacity": 0.6, "line-width": ["interpolate", ["linear"], ["zoom"], 13, 0.8, 18, 1.8] } });
      map.addLayer({ id: "contorno-halo", type: "line", source: "contorno", layout: { "line-join": "round" }, paint: { "line-color": acento, "line-width": 3, "line-opacity": 0, "line-blur": 6 } });
      map.addLayer({ id: "contorno", type: "line", source: "contorno", layout: { "line-join": "round" }, paint: { "line-color": acento, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 2, 16, 2.8, 20, 3.6], "line-opacity": D.contorno.length ? 0.95 : 0 } });
    } else map.setPaintProperty("contorno", "line-opacity", D.contorno.length ? 0.95 : 0);
    map.setLayerZoomRange("lotes-linea", zLinea, 24);
    if (encuadrar) encuadre(false);
    $("llegar").href = "https://www.google.com/maps/dir/?api=1&destination=" + D.centro[1].toFixed(6) + "," + D.centro[0].toFixed(6);
    pedirPintar();
  }
  // Sin contorno en el archivo: la orilla de los lotes (solo para el pulso y para encuadrar; no se dibuja)
  function envolvente(d) {
    const pts = []; d.lotes.forEach((l) => l.c.forEach((p) => pts.push(p))); d.otras.forEach((o) => o.c.forEach((p) => pts.push(p)));
    if (pts.length < 3) return [];
    pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cruz = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]), inf = [], sup = [];
    for (const p of pts) { while (inf.length >= 2 && cruz(inf[inf.length - 2], inf[inf.length - 1], p) <= 0) inf.pop(); inf.push(p); }
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (sup.length >= 2 && cruz(sup[sup.length - 2], sup[sup.length - 1], p) <= 0) sup.pop(); sup.push(p); }

  }
  function encuadre(animado) {
    const c = D.caja; if (!(c[2] >= c[0])) return;
    const chico = Math.min(innerWidth, innerHeight) < 520, m = chico ? 34 : 70;
    map.fitBounds([[c[0], c[1]], [c[2], c[3]]], { padding: { top: m + 54, bottom: m + 40, left: m, right: m }, maxZoom: 19.5, duration: animado ? 700 : 0 });
  }
  // ---- Satélite ----
  function ponerSat() {
    const quiere = conSat && !!SAT;
    if (map.getLayer("sat")) map.setLayoutProperty("sat", "visibility", quiere ? "visible" : "none");
    else if (quiere) {
      map.addSource("sat", { type: "raster", tiles: [SAT], tileSize: /static-map-tiles-api|tileSize=512/.test(SAT) ? 512 : 256, maxzoom: 19 });
      map.addLayer({ id: "sat", type: "raster", source: "sat", paint: { "raster-fade-duration": 180 } }, map.getLayer("calles") ? "calles" : undefined);
      atribucion();
    }
    $("ctl").querySelector('[data-c="sat"]').setAttribute("aria-pressed", String(quiere));
    $("ctl").querySelector('[data-c="sat"]').hidden = !SAT;
    $("atrib").hidden = !quiere || !$("atrib").textContent;
  }
  function atribucion() {
    const a = $("atrib"); if (a.textContent || !/arcgis\.com/.test(SAT)) return;
